<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Clínica del Sol</title>
    <link rel="icon" href="LogoNeuro.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: linear-gradient(135deg, #f0f4f8 0%, #d9e6f2 100%); font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .login-card { max-width: 440px; width: 100%; background: white; padding: 45px 40px; border-radius: 20px; box-shadow: 0px 15px 35px rgba(12, 74, 110, 0.12); border-top: 6px solid #0c4a6e; }
        .logo-placeholder { width: 95px; height: 95px; background-color: #f1f5f9; border-radius: 50%; margin: 0 auto 20px auto; display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .logo-img { width: 100%; height: 100%; object-fit: cover; }
        .medical-header h4 { color: #0c4a6e; font-size: 1.4rem; font-weight: 700; text-align: center; margin-bottom: 4px; }
        .medical-header small { color: #0284c7; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; font-size: 0.78rem; display: block; margin-bottom: 25px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; font-weight: 600; color: #475569; font-size: 0.85rem; margin-bottom: 6px; }
        .form-control { width: 100%; border: 1px solid #cbd5e1; padding: 11px 14px; border-radius: 10px; font-size: 0.95rem; background-color: #f8fafc; outline: none; }
        .form-control:focus { border-color: #0284c7; background-color: #fff; box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15); }
        .btn-medical { background-color: #0284c7; border: none; color: white; padding: 14px; font-weight: 600; border-radius: 10px; width: 100%; font-size: 1rem; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2); }
        .btn-medical:hover { background-color: #0369a1; }
        .btn-medical:disabled { opacity: 0.7; cursor: wait; }
        .mensaje { display: none; margin-top: 15px; padding: 12px 14px; border-radius: 10px; font-size: 0.9rem; font-weight: 500; }
        .mensaje.ok { display: block; background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
        .mensaje.error { display: block; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
        .footer-box { margin-top: 25px; padding-top: 15px; border-top: 1px solid #e2e8f0; text-align: center; }
        .link-footer { color: #64748b; font-size: 0.88rem; font-weight: 500; text-decoration: none; }
        .link-footer:hover { color: #0284c7; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-placeholder">
        <img src="LogoNeuro.png" class="logo-img" alt="Logo Médico">
    </div>
    <div class="medical-header">
        <h4>CLÍNICA DEL SOL</h4>
        <small>Iniciar sesión</small>
    </div>

    <form id="loginForm">
        <div class="form-group">
            <label class="form-label" for="l_email">Correo electrónico</label>
            <input type="email" class="form-control" id="l_email" placeholder="ejemplo@correo.com" autocomplete="username" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="l_password">Contraseña</label>
            <input type="password" class="form-control" id="l_password" placeholder="Tu contraseña" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn-medical" id="btnEntrar">Entrar</button>
        <div id="mensaje" class="mensaje" role="status" aria-live="polite"></div>
    </form>

    <div class="footer-box">
        <a href="index.html" class="link-footer">¿No tienes cuenta? Regístrate aquí</a>
    </div>
</div>

<script>
    // Supabase Auth con fetch nativo (sin librerías externas)
    const SUPABASE_URL = "https://bnfecywizaewbspsskfg.supabase.co";
    const SUPABASE_KEY = "sb_publishable_MWEf-M1gHqJCeo8IjerJlQ_T_culJ-1";
    const PAGINA_FORMULARIO = "pacientes.html";

    const form = document.getElementById("loginForm");
    const boton = document.getElementById("btnEntrar");
    const cajaMensaje = document.getElementById("mensaje");

    function mostrarMensaje(texto, tipo) {
        cajaMensaje.textContent = texto;
        cajaMensaje.className = "mensaje " + tipo;
    }

    function traducirError(datos, estado) {
        const codigo = datos.error_code || datos.code || "";
        if (codigo === "invalid_credentials") return "Correo o contraseña incorrectos.";
        if (codigo === "email_not_confirmed") return "Debes confirmar tu correo antes de iniciar sesión. Revisa tu bandeja de entrada.";
        if (codigo === "over_request_rate_limit" || estado === 429) return "Demasiados intentos. Espera unos minutos e inténtalo de nuevo.";
        return datos.msg || datos.error_description || datos.message || ("Error " + estado);
    }

    form.addEventListener("submit", async function (e) {
        e.preventDefault();

        boton.disabled = true;
        boton.textContent = "Entrando...";
        cajaMensaje.className = "mensaje";

        try {
            // 1. Iniciar sesión
            const respuesta = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
                method: "POST",
                headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
                body: JSON.stringify({
                    email: document.getElementById("l_email").value.trim().toLowerCase(),
                    password: document.getElementById("l_password").value
                })
            });

            let sesion = {};
            try { sesion = await respuesta.json(); } catch (_) {}
            if (!respuesta.ok) throw new Error(traducirError(sesion, respuesta.status));

            // 2. Leer el perfil propio (la política RLS solo deja ver la fila del usuario)
            const resPerfil = await fetch(
                SUPABASE_URL + "/rest/v1/usuarios?select=num_id,tipo_documento,nombre_completo,rol&auth_id=eq." + encodeURIComponent(sesion.user.id),
                {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": "Bearer " + sesion.access_token,
                        "Accept": "application/vnd.pgrst.object+json"
                    }
                }
            );
            if (!resPerfil.ok) throw new Error("Iniciaste sesión, pero no se encontró tu perfil de usuario.");
            const perfil = await resPerfil.json();

            // 3. Guardar la sesión solo mientras la pestaña esté abierta
            sessionStorage.setItem("sb_access_token", sesion.access_token);
            sessionStorage.setItem("sb_expires_at", String(Date.now() + (sesion.expires_in || 3600) * 1000));
            sessionStorage.setItem("sb_perfil", JSON.stringify(perfil));

            // Pacientes y personal van al mismo formulario (el paciente ve sus datos ya cargados)
            window.location.href = PAGINA_FORMULARIO;
            return;

        } catch (error) {
            mostrarMensaje(
                error instanceof TypeError
                    ? "No se pudo conectar con el servidor. Revisa tu conexión a internet."
                    : error.message,
                "error"
            );
        } finally {
            boton.disabled = false;
            boton.textContent = "Entrar";
        }
    });
</script>
</body>
</html>
