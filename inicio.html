<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clínica del Sol · Neurocirugía en Barranquilla, Colombia</title>
<link rel="icon" href="LogoNeuro.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;color:#0f172a;background:#f0f4f8;line-height:1.55}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
header{background:#fff;border-bottom:1px solid #e2e8f0}
header .wrap{display:flex;align-items:center;gap:12px;padding:12px 20px}
header img{width:44px;height:44px;border-radius:50%;object-fit:cover}
header b{color:#0c4a6e;font-size:1.05rem;flex:1}
.idioma button{border:1px solid #cbd5e1;background:#fff;padding:5px 11px;border-radius:8px;cursor:pointer;font-weight:600;color:#475569}
.idioma button.on{background:#0284c7;border-color:#0284c7;color:#fff}
.hero{background:linear-gradient(135deg,#0c4a6e,#0284c7);color:#fff;padding:56px 0}
.hero h1{font-size:2rem;max-width:680px;line-height:1.25}
.hero p{margin:14px 0 24px;max-width:620px;opacity:.95}
.btn{display:inline-block;background:#fff;color:#0c4a6e;font-weight:700;padding:13px 26px;border-radius:10px;text-decoration:none;border:0;font-size:1rem;cursor:pointer}
section{padding:40px 0}
h2{color:#0c4a6e;margin-bottom:16px;font-size:1.4rem}
.pasos,.cond{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.tarjeta{background:#fff;border-radius:14px;padding:18px;box-shadow:0 4px 14px rgba(12,74,110,.07)}
.tarjeta b{color:#0284c7}
.cond .tarjeta{border-left:4px solid #0284c7;font-weight:600}
.nota{margin-top:14px;color:#64748b;font-size:.9rem}
.card-form{background:#fff;border-radius:20px;padding:32px;border-top:6px solid #0c4a6e;box-shadow:0 15px 35px rgba(12,74,110,.12);max-width:560px;margin:0 auto}
label{display:block;font-weight:600;color:#475569;font-size:.85rem;margin:12px 0 5px}
input,select,textarea{width:100%;border:1px solid #cbd5e1;padding:11px 14px;border-radius:10px;font:inherit;background:#f8fafc;outline:none}
input:focus,select:focus,textarea:focus{border-color:#0284c7;box-shadow:0 0 0 4px rgba(2,132,199,.15);background:#fff}
textarea{min-height:90px;resize:vertical}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin-top:14px}
.chk input{width:auto;margin-top:4px}
.enviar{width:100%;margin-top:18px;background:#0284c7;color:#fff}
.enviar:disabled{opacity:.7;cursor:wait}
.msg{display:none;margin-top:14px;padding:12px 14px;border-radius:10px;font-weight:500;font-size:.92rem}
.msg.ok{display:block;background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.msg.error{display:block;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.trampa{position:absolute;left:-9999px}
footer{background:#0c4a6e;color:#cbd5e1;padding:26px 0;font-size:.85rem}
footer a{color:#fff}
[hidden]{display:none!important}
@media(max-width:560px){.hero h1{font-size:1.5rem}.card-form{padding:22px}}
</style>
</head>
<body>
<header><div class="wrap">
  <img src="LogoNeuro.png" alt="Logo"><b>CLÍNICA DEL SOL</b>
  <div class="idioma"><button id="bes" class="on">ES</button> <button id="ben">EN</button></div>
</div></header>

<div class="hero"><div class="wrap">
  <h1 data-t="h1"></h1>
  <p data-t="sub"></p>
  <a class="btn" href="#contacto" data-t="cta"></a>
</div></div>

<section><div class="wrap">
  <h2 data-t="comoT"></h2>
  <div class="pasos">
    <div class="tarjeta"><b>1.</b> <span data-t="p1"></span></div>
    <div class="tarjeta"><b>2.</b> <span data-t="p2"></span></div>
    <div class="tarjeta"><b>3.</b> <span data-t="p3"></span></div>
  </div>
</div></section>

<section style="background:#fff"><div class="wrap">
  <h2 data-t="condT"></h2>
  <div class="cond" id="cond"></div>
  <p class="nota" data-t="condN"></p>
</div></section>

<section id="quien" hidden><div class="wrap">
  <h2 data-t="quienT"></h2>
  <div class="tarjeta" id="quienTxt"></div>
</div></section>

<section id="contacto"><div class="wrap">
  <div class="card-form">
    <h2 data-t="formT"></h2>
    <form id="f" novalidate>
      <label for="nombre" data-t="lNombre"></label>
      <input id="nombre" maxlength="120" required>
      <label for="pais" data-t="lPais"></label>
      <select id="pais"><option value=""></option></select>
      <label for="rel" data-t="lRel"></label>
      <select id="rel">
        <option value="paciente" data-t="rPac"></option>
        <option value="familiar" data-t="rFam"></option>
        <option value="otro" data-t="rOtro"></option>
      </select>
      <label for="correo" data-t="lCorreo"></label>
      <input id="correo" type="email" maxlength="160" autocomplete="email">
      <label for="tel" data-t="lTel"></label>
      <input id="tel" type="tel" maxlength="40" autocomplete="tel">
      <label for="mensaje" data-t="lMsg"></label>
      <textarea id="mensaje" maxlength="600"></textarea>
      <label class="chk"><input type="checkbox" id="ok"><span><span data-t="lOk"></span> <a id="pol" href="#" target="_blank" rel="noopener" hidden data-t="lPol"></a></span></label>
      <div class="trampa" aria-hidden="true"><label>Web <input id="web" tabindex="-1" autocomplete="off"></label></div>
      <button class="btn enviar" id="bEnv" type="submit" data-t="enviar"></button>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </form>
  </div>
</div></section>

<footer><div class="wrap">
  <p data-t="aviso"></p>
  <p style="margin-top:8px"><a href="index.html" data-t="acceso"></a></p>
</div></footer>

<script>
/* ===== CONFIGURACIÓN: completa estos datos; la sección "Quién atiende" solo aparece si hay nombre ===== */
const CONFIG = {
  profesional: "",   // Ej.: "Dr. Nombre Apellido"
  especialidad: "",  // Ej.: "Neurocirujano"
  registro: "",      // Ej.: "Registro profesional / RETHUS: ..."
  institucion: "",   // Ej.: "Hospital o clínica donde atiende"
  politicaUrl: ""    // Enlace a la política de tratamiento de datos (opcional)
};
const SUPABASE_URL = "https://bnfecywizaewbspsskfg.supabase.co";
const SUPABASE_KEY = "sb_publishable_MWEf-M1gHqJCeo8IjerJlQ_T_culJ-1";

const T = {
es: {
 h1:"Valoración neuroquirúrgica especializada y segunda opinión desde Barranquilla, Colombia",
 sub:"Información y evaluación para casos neuroquirúrgicos complejos, para pacientes de cualquier país. Déjenos sus datos de contacto y nuestro equipo se comunicará con usted.",
 cta:"Quiero que me contacten",
 comoT:"Cómo funciona", p1:"Usted deja sus datos de contacto en el formulario.", p2:"Nuestro equipo se comunica con usted para entender el caso y explicarle cómo enviar los estudios de forma segura.", p3:"Se realiza una valoración y se le informa si es posible y recomendable una consulta presencial en Barranquilla.",
 condT:"Patologías sobre las que ofrecemos valoración",
 condN:"Información general. Cada caso requiere una evaluación individual; ningún tratamiento garantiza resultados y todos tienen riesgos que se explican antes de decidir.",
 quienT:"Quién atiende",
 formT:"Contacto", lNombre:"Nombre completo", lPais:"País", lRel:"Quien escribe es", rPac:"El paciente", rFam:"Un familiar", rOtro:"Otra persona",
 lCorreo:"Correo electrónico", lTel:"Teléfono / WhatsApp (con código de país)", lMsg:"Mensaje (opcional). Por favor no envíe informes médicos por aquí.",
 lOk:"Autorizo el tratamiento de mis datos personales para que la clínica se comunique conmigo (Ley 1581 de 2012).", lPol:"Política de datos",
 enviar:"Enviar", enviando:"Enviando...",
 exito:"Gracias. Recibimos sus datos y nuestro equipo se comunicará con usted.",
 eFalta:"Escriba su nombre y al menos un medio de contacto (correo o teléfono).", eOk:"Debe aceptar el tratamiento de datos para continuar.",
 eLim:"Hemos recibido muchas solicitudes. Intente de nuevo más tarde.", eGen:"No pudimos enviar el formulario. Intente de nuevo en unos minutos.",
 aviso:"La información de este sitio es general y no sustituye una consulta médica. Los resultados dependen de cada caso y no pueden garantizarse.",
 acceso:"Acceso para pacientes registrados", selPais:"Seleccione el país"
},
en: {
 h1:"Specialized neurosurgical evaluation and second opinion from Barranquilla, Colombia",
 sub:"Information and evaluation for complex neurosurgical cases, for patients from any country. Leave your contact details and our team will get in touch with you.",
 cta:"Please contact me",
 comoT:"How it works", p1:"You leave your contact details in the form.", p2:"Our team contacts you to understand the case and explains how to send your studies securely.", p3:"An evaluation is carried out and you are told whether an in-person consultation in Barranquilla is possible and advisable.",
 condT:"Conditions for which we offer evaluation",
 condN:"General information. Each case requires individual evaluation; no treatment guarantees results and all carry risks that are explained before any decision.",
 quienT:"Who will see you",
 formT:"Contact", lNombre:"Full name", lPais:"Country", lRel:"I am writing as", rPac:"The patient", rFam:"A family member", rOtro:"Someone else",
 lCorreo:"Email", lTel:"Phone / WhatsApp (with country code)", lMsg:"Message (optional). Please do not send medical reports here.",
 lOk:"I authorize the processing of my personal data so that the clinic can contact me.", lPol:"Data policy",
 enviar:"Send", enviando:"Sending...",
 exito:"Thank you. We received your details and our team will contact you.",
 eFalta:"Please enter your name and at least one way to reach you (email or phone).", eOk:"You must accept the data processing to continue.",
 eLim:"We have received many requests. Please try again later.", eGen:"We could not send the form. Please try again in a few minutes.",
 aviso:"The information on this site is general and does not replace a medical consultation. Results depend on each case and cannot be guaranteed.",
 acceso:"Registered patient access", selPais:"Select your country"
}};
const COND = {
 es:["Aneurismas del seno cavernoso","Artrosis","Fractura de odontoides","Malformación talámica","Macrotumores supra e infratentoriales","Malformación arteriovenosa Spetzler-Martin grado 5","Malformación cerebelosa","Neuralgia del trigémino (rizólisis)","Tumores de la parte posterior del tercer ventrículo"],
 en:["Cavernous sinus aneurysms","Osteoarthritis","Odontoid fracture","Thalamic malformation","Large supra- and infratentorial tumors","Spetzler-Martin grade 5 arteriovenous malformation","Cerebellar malformation","Trigeminal neuralgia (rhizolysis)","Tumors of the posterior third ventricle"]
};

let lang = (navigator.language || "es").toLowerCase().startsWith("en") ? "en" : "es";
let paises = [];
const $ = id => document.getElementById(id);
const t0 = Date.now();

function nombrePais(p) {
  try { return new Intl.DisplayNames([lang], { type: "region" }).of(p.codigo) || p.descripcion; }
  catch (_) { return p.descripcion; }
}
function pintarPaises() {
  const actual = $("pais").value;
  const lista = paises.map(p => ({ c: p.codigo, n: nombrePais(p) })).sort((a, b) => a.n.localeCompare(b.n, lang));
  $("pais").innerHTML = "";
  const o0 = document.createElement("option"); o0.value = ""; o0.textContent = T[lang].selPais; $("pais").appendChild(o0);
  lista.forEach(p => { const o = document.createElement("option"); o.value = p.c; o.textContent = p.n; $("pais").appendChild(o); });
  $("pais").value = actual;
}
function aplicar(l) {
  lang = l;
  document.documentElement.lang = l;
  document.querySelectorAll("[data-t]").forEach(e => { e.textContent = T[l][e.dataset.t]; });
  $("cond").innerHTML = "";
  COND[l].forEach(n => { const d = document.createElement("div"); d.className = "tarjeta"; d.textContent = n; $("cond").appendChild(d); });
  $("bes").classList.toggle("on", l === "es"); $("ben").classList.toggle("on", l === "en");
  if (paises.length) pintarPaises(); else { $("pais").options[0].textContent = T[l].selPais; }
  if (CONFIG.profesional) {
    $("quien").hidden = false;
    $("quienTxt").textContent = [CONFIG.profesional, CONFIG.especialidad, CONFIG.registro, CONFIG.institucion].filter(Boolean).join(" · ");
  }
  if (CONFIG.politicaUrl) { $("pol").hidden = false; $("pol").href = CONFIG.politicaUrl; }
}
$("bes").onclick = () => aplicar("es");
$("ben").onclick = () => aplicar("en");

async function cargarPaises() {
  try {
    const r = await fetch(SUPABASE_URL + "/rest/v1/pais?select=codigo,descripcion&order=descripcion.asc&limit=1000", { headers: { apikey: SUPABASE_KEY } });
    if (!r.ok) throw new Error();
    paises = await r.json(); pintarPaises();
  } catch (_) { /* sin lista: el país queda vacío y el formulario igual se puede enviar */ }
}

function mensaje(texto, tipo) { $("msg").textContent = texto; $("msg").className = "msg " + tipo; }

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const L = T[lang];
  if ($("web").value || Date.now() - t0 < 3000) { mensaje(L.exito, "ok"); return; }  // trampa antispam: se finge éxito
  const nombre = $("nombre").value.trim(), correo = $("correo").value.trim(), tel = $("tel").value.trim();
  if (nombre.length < 2 || (!correo && !tel) || ($("correo").value && !$("correo").checkValidity())) { mensaje(L.eFalta, "error"); return; }
  if (!$("ok").checked) { mensaje(L.eOk, "error"); return; }

  $("bEnv").disabled = true; $("bEnv").textContent = L.enviando; $("msg").className = "msg";
  const origen = new URLSearchParams(location.search).get("utm_source");
  try {
    const r = await fetch(SUPABASE_URL + "/rest/v1/contactos", {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json", Prefer: "return=minimal" },
      body: JSON.stringify({
        nombre, codigo_pais: $("pais").value || null, relacion: $("rel").value,
        correo: correo || null, telefono: tel || null, idioma: lang,
        mensaje: $("mensaje").value.trim() || null, origen: origen ? origen.slice(0, 60) : null, consentimiento: true
      })
    });
    if (!r.ok) {
      let m = ""; try { m = (await r.json()).message || ""; } catch (_) {}
      throw new Error(/demasiad/i.test(m) ? "lim" : "gen");
    }
    mensaje(L.exito, "ok"); $("f").reset();
  } catch (err) {
    mensaje(err.message === "lim" ? L.eLim : L.eGen, "error");
  } finally { $("bEnv").disabled = false; $("bEnv").textContent = L.enviar; }
});

aplicar(lang);
cargarPaises();
</script>
</body>
</html>
