<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Clínica del Sol</title>
    <link rel="icon" href="LogoNeuro.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: linear-gradient(135deg, #f0f4f8 0%, #d9e6f2 100%); font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .register-card { max-width: 500px; width: 100%; background: white; padding: 45px 40px; border-radius: 20px; box-shadow: 0px 15px 35px rgba(12, 74, 110, 0.12); border-top: 6px solid #0c4a6e; }
        .logo-placeholder { width: 95px; height: 95px; background-color: #f1f5f9; border-radius: 50%; margin: 0 auto 20px auto; display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .logo-img { width: 100%; height: 100%; object-fit: cover; }
        .medical-header h4 { color: #0c4a6e; font-size: 1.4rem; font-weight: 700; text-align: center; margin-bottom: 4px; }
        .medical-header small { color: #0284c7; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; font-size: 0.78rem; display: block; margin-bottom: 25px; text-align: center; }
        .row-grid { display: flex; gap: 15px; margin-bottom: 15px; }
        .col-4 { width: 35%; }
        .col-8 { width: 65%; }
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; font-weight: 600; color: #475569; font-size: 0.85rem; margin-bottom: 6px; }
        .form-control, .form-select { width: 100%; border: 1px solid #cbd5e1; padding: 11px 14px; border-radius: 10px; font-size: 0.95rem; background-color: #f8fafc; outline: none; }
        .form-control:focus, .form-select:focus { border-color: #0284c7; background-color: #fff; box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15); }
        .btn-medical { background-color: #0284c7; border: none; color: white; padding: 14px; font-weight: 600; border-radius: 10px; width: 100%; font-size: 1rem; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2); }
        .btn-medical:hover { background-color: #0369a1; }
        .btn-medical:disabled { opacity: 0.7; cursor: wait; }
        .mensaje { display: none; margin-top: 15px; padding: 12px 14px; border-radius: 10px; font-size: 0.9rem; font-weight: 500; }
        .mensaje.ok { display: block; background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
        .mensaje.error { display: block; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
        .footer-box { margin-top: 25px; padding-top: 15px; border-top: 1px solid #e2e8f0; text-align: center; }
        .link-footer { color: #64748b; font-size: 0.88rem; font-weight: 500; text-decoration: none; }
        .link-footer:hover { color: #0284c7; }
    </style>
</head>
<body>

<div class="register-card">
    <div class="logo-placeholder">
        <img src="LogoNeuro.png" class="logo-img" alt="Logo Médico">
    </div>
    <div class="medical-header">
        <h4>CLÍNICA DEL SOL</h4>
        <small>Registro de Cuenta para Pacientes</small>
    </div>

    <form id="pacienteRegisterForm">
        <div class="row-grid">
            <div class="col-4">
                <label class="form-label" for="p_tipo">Tipo Doc.</label>
                <select class="form-select" id="p_tipo" required>
                    <option value="CC">Cédula</option>
                    <option value="TI">T. identidad</option>
                    <option value="CE">C. extranjería</option>
                    <option value="PAS">Pasaporte</option>
                    <option value="NUIP">NUIP</option>
                </select>
            </div>
            <div class="col-8">
                <label class="form-label" for="p_id">Número Identificación (Llave)</label>
                <input type="text" class="form-control" id="p_id" inputmode="numeric" pattern="[0-9]{4,15}" title="Solo números, sin puntos ni espacios" placeholder="Solo números, sin puntos" required>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label" for="p_nombre">Nombre Completo</label>
            <input type="text" class="form-control" id="p_nombre" placeholder="Nombres y apellidos completos" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="p_email">Correo Electrónico Personal</label>
            <input type="email" class="form-control" id="p_email" placeholder="ejemplo@correo.com" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="p_password">Asignar Contraseña de Acceso</label>
            <input type="password" class="form-control" id="p_password" placeholder="Mínimo 6 caracteres" minlength="6" autocomplete="new-password" required>
        </div>

        <button type="submit" class="btn-medical" id="btnCrear">Registrar Mi Cuenta de Paciente</button>
        <div id="mensaje" class="mensaje" role="status" aria-live="polite"></div>
    </form>

    <div class="footer-box">
        <a href="login-paciente.html" class="link-footer">¿Ya tienes una cuenta registrada? Inicia sesión aquí</a>
    </div>
</div>

<script>
    // Supabase Auth con fetch nativo (sin librerías externas)
    const SUPABASE_URL = "https://bnfecywizaewbspsskfg.supabase.co";
    const SUPABASE_KEY = "sb_publishable_MWEf-M1gHqJCeo8IjerJlQ_T_culJ-1";

    const form = document.getElementById("pacienteRegisterForm");
    const boton = document.getElementById("btnCrear");
    const cajaMensaje = document.getElementById("mensaje");

    function mostrarMensaje(texto, tipo) {
        cajaMensaje.textContent = texto;
        cajaMensaje.className = "mensaje " + tipo;
    }

    function traducirError(datos, estado) {
        const codigo = datos.error_code || datos.code || "";
        const texto = datos.msg || datos.message || datos.error_description || "";
        if (codigo === "user_already_exists" || codigo === "email_exists") return "Ya existe una cuenta con ese correo.";
        if (codigo === "weak_password") return "La contraseña es muy débil. Usa al menos 6 caracteres.";
        if (codigo === "over_email_send_rate_limit" || codigo === "over_request_rate_limit" || estado === 429) return "Demasiados intentos. Espera unos minutos e inténtalo de nuevo.";
        if (codigo === "signup_disabled") return "El registro de cuentas está deshabilitado.";
        if (codigo === "validation_failed" || codigo === "email_address_invalid") return "El correo electrónico no es válido.";
        if (/database error/i.test(texto)) return "No se pudo crear el perfil. Es posible que ese número de identificación ya esté registrado.";
        return texto || ("Error " + estado);
    }

    form.addEventListener("submit", async function (e) {
        e.preventDefault();

        boton.disabled = true;
        boton.textContent = "Registrando...";
        cajaMensaje.className = "mensaje";

        const cuerpo = {
            email: document.getElementById("p_email").value.trim().toLowerCase(),
            password: document.getElementById("p_password").value,
            // El perfil en la tabla usuarios lo crea la base de datos con estos datos (rol siempre = Paciente)
            data: {
                num_id: document.getElementById("p_id").value.trim(),
                tipo_documento: document.getElementById("p_tipo").value,
                nombre_completo: document.getElementById("p_nombre").value.trim()
            }
        };

        try {
            const respuesta = await fetch(SUPABASE_URL + "/auth/v1/signup", {
                method: "POST",
                headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
                body: JSON.stringify(cuerpo)
            });

            let datos = {};
            try { datos = await respuesta.json(); } catch (_) {}

            if (!respuesta.ok) throw new Error(traducirError(datos, respuesta.status));

            mostrarMensaje(
                datos.access_token
                    ? "¡Cuenta creada con éxito! Ya puedes iniciar sesión."
                    : "¡Cuenta creada! Revisa tu correo y confirma tu cuenta antes de iniciar sesión.",
                "ok"
            );
            form.reset();

        } catch (error) {
            mostrarMensaje(
                error instanceof TypeError
                    ? "No se pudo conectar con el servidor. Revisa tu conexión a internet."
                    : "No se pudo registrar: " + error.message,
                "error"
            );
        } finally {
            boton.disabled = false;
            boton.textContent = "Registrar Mi Cuenta de Paciente";
        }
    });
</script>
</body>
</html>
